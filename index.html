<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Orçamentos TechPrime</title>
<style>
:root{--bg:#050505;--c:#0f0f12;--l:#2b2515;--tx:#f5f2e9;--m:#8d8979;--g:#e6c15a;--n:#00ff94;--r:#ff5d5d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 50% at 50% -10%,#1d1808 0,var(--bg) 60%) fixed;color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 130px}
header{position:sticky;top:0;z-index:5;background:#000;padding:10px 16px 0;border-bottom:1px solid var(--g)}
.logo{display:block;height:50px;max-width:100%;margin-bottom:6px}
nav{display:flex;overflow-x:auto}nav button{flex:1;background:0;border:0;border-bottom:3px solid transparent;color:var(--m);font-weight:600;font-size:14px;padding:10px 8px;white-space:nowrap}
nav button.on{color:var(--g);border-color:var(--g)}
main{padding:0 16px;max-width:640px;margin:auto}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--g);margin:20px 0 10px}h3{font-size:13px;color:var(--m);margin:18px 0 8px;letter-spacing:.08em;text-transform:uppercase}
.card,.kpi{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:6px 14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .kpi{padding:12px 14px;margin:0}.kpi small{color:var(--m);display:block;font-size:12px}.kpi b{color:var(--n);font-size:19px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--l)}.row:last-child{border:0}.n{flex:1;min-width:0}.row small{color:var(--m);display:block}
.pr{color:var(--n);font-weight:700;white-space:nowrap}
label{display:block;color:var(--m);font-size:13px;margin:10px 0}
input,textarea,select{width:100%;background:#000;border:1px solid var(--l);color:var(--tx);border-radius:12px;padding:11px;font:inherit;margin-top:4px}
input:focus,textarea:focus{outline:0;border-color:var(--g)}select{width:auto;margin:0;padding:9px}
.search{margin:0 0 6px}
.ib{background:0;border:0;font-size:19px;padding:6px;color:var(--g)}.ib.d{color:var(--r)}
.st{display:flex;align-items:center;gap:6px}.st button{width:36px;height:36px;border-radius:50%;border:1px solid var(--l);background:#000;color:var(--tx);font-size:20px}
.st b{min-width:26px;text-align:center}.st.on b{color:var(--n)}.st.on button{border-color:var(--g)}
.btn{background:var(--c);border:1px solid var(--l);color:var(--tx);border-radius:12px;padding:11px 14px;font:inherit;font-weight:600}
.btn.p{background:var(--g);color:#1a1400;border-color:var(--g)}.btn.wa{background:var(--n);color:#00210f;border-color:var(--n);box-shadow:0 0 14px #00ff9433}.btn.dg{background:var(--r);color:#fff;border-color:var(--r)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.chip{background:var(--c);border:1px solid var(--l);color:var(--m);border-radius:20px;padding:6px 13px;font-size:13px;text-transform:capitalize}.chip.on{border-color:var(--g);color:var(--g)}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 12px;align-items:center}
.warn{border-color:var(--g);display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#000;border-top:1px solid var(--g);display:flex;align-items:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar>div{flex:1}.bar small{color:var(--m);display:block;font-size:12px}.bar b{font-size:21px;color:var(--n)}.bar .btn{padding:10px 12px;font-size:14px}
#fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;border:0;background:var(--n);box-shadow:0 0 24px #00ff9466;display:grid;place-items:center}
#fab svg{width:30px;height:30px;stroke:#00210f;fill:none;stroke-width:2}
.empty{color:var(--m);text-align:center;padding:30px 10px}.top{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--g);color:#1a1400;padding:10px 16px;border-radius:20px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:30}#toast.on{opacity:1}
#mod2{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}#mod2.on{display:flex}
#mod2 .box{background:var(--c);border:1px solid var(--g);border-radius:18px;padding:20px;max-width:360px;width:100%;max-height:90vh;overflow:auto}#mod2 p{margin:0;font-weight:700;color:var(--g)}#mod2 .acts{justify-content:flex-end;padding:8px 0 0}
#cl{position:absolute;right:16px;top:14px;font-size:12px;color:var(--g)}
</style>
</head>

    dup:()=>{q=JSON.parse(JSON.stringify(fq()));Object.assign(q,{id:null,num:0,date:Date.now(),status:'rascunho',stockDone:false,ret:''});flt='';view='form';render();scrollTo(0,0);toast('Cópia criada: ajuste e salve')},
    del:()=>ask('Excluir este orçamento?',()=>{const x=fq();if(x.stockDone)setStatus(x,'rascunho');db.quotes=db.quotes.filter(z=>z!==x);save();render()}),
    ent:()=>ent(k,id),rm:()=>rm(k,id),qc:()=>newQ(db.clients.find(z=>z.id===id)),
    save:()=>{if(commit()){toast('Orçamento salvo');view='quotes';render()}},
    share:()=>{if(commit())sendWA(q)},
    mn:()=>stp(t,id,-1),pl:()=>stp(t,id,1),
    addx:()=>{const n=$('#x-n').value.trim();if(!n){toast('Digite a descrição');return}q.items.push({t:'x',id:'',name:n,price:num($('#x-p').value),cost:0,qty:1,war:''});drawExt();drawTot()},
    delx:()=>{q.items.splice(+b.dataset.n,1);drawExt();drawTot()},
    calckm:calcKm,conn:connect,sync:()=>pull().then(()=>toast('Sincronizado')).catch(()=>toast('Sem conexão')),hist:hist,disc:()=>ask('Desconectar da nuvem? Os dados continuam neste aparelho.',()=>{cc=null;localStorage.removeItem(CK);cstat('');render()}),snap:()=>ask('Restaurar a versão de '+fd(id)+'? Substitui os dados atuais.',async()=>{try{const r=await api('app_snapshots?select=data&day=eq.'+id);if(r&&r[0]){db=r[0].data;fix();save();render();toast('Versão restaurada')}}catch(e){toast('Falha ao restaurar')}}),exp:exp,imp:()=>$('#imp').click(),
    retwa:()=>{const x=fq();openWA(x,'Olá'+(x.client?', '+x.client:'')+'! Tudo bem? '+(x.status==='enviado'?'Passando para saber se você já decidiu sobre o orçamento nº '+x.num+' ('+R(tot(x))+').':'Passando para saber se está tudo certo com o serviço do orçamento nº '+x.num+'.')+' Fico à disposição!')}
  };
  (A[a]||(()=>{}))();
});
$('#imp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.services||!d.quotes)throw 0;ask('Substituir os dados atuais pelo backup?',()=>{db=d;fix();save();render();toast('Backup restaurado')})}catch(x){toast('Arquivo inválido')}};
  r.readAsText(f);e.target.value='';
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();initCloud();
</script>
