<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Orçamentos TI</title>
<style>
:root{--bg:#0b0f17;--card:#121826;--line:#1d2638;--tx:#e8edf5;--mut:#8592a8;--g:#00ffb3;--b:#2cb7ff;--r:#ff5a5a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 120px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 0;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 10px}h2{font-size:18px;margin:16px 0 8px}h3{font-size:15px;margin:18px 0 8px;color:var(--mut)}
nav{display:flex;gap:4px}nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:inherit;padding:10px;font-weight:600}
nav button.on{color:var(--g);border-color:var(--g)}
main{padding:0 16px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row .n{flex:1;min-width:0}.row small{color:var(--mut);display:block}
.pr{color:var(--g);font-weight:700;white-space:nowrap}
label{display:block;color:var(--mut);font-size:13px;margin:10px 0}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px;font:inherit;margin-top:4px}
.search{margin:0 0 10px}
.ib{background:none;border:0;font-size:19px;padding:6px;color:var(--b)}.ib.d{color:var(--r)}
.st{display:flex;align-items:center;gap:6px}.st button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:20px}
.st b{min-width:24px;text-align:center}.st.on b{color:var(--g)}
.btn{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 14px;font:inherit;font-weight:600}
.btn.p{background:var(--g);color:#032;border-color:var(--g)}.btn.wa{background:#25d366;color:#032;border-color:#25d366}
.tag{font-size:12px;border-radius:20px;padding:2px 9px;border:1px solid var(--line);color:var(--mut)}.tag.ok{color:var(--g);border-color:var(--g)}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar>div{flex:1}.bar small{color:var(--mut);display:block;font-size:12px}.bar b{font-size:20px;color:var(--g)}
#fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;border:0;background:var(--g);box-shadow:0 0 22px #00ffb355;display:grid;place-items:center}
#fab svg{width:30px;height:30px;stroke:#032;fill:none;stroke-width:2}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:600;opacity:0;pointer-events:none;transition:.2s}
#toast.on{opacity:1}
.top{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.bar .btn{padding:10px 12px;font-size:14px}
#toast{z-index:30}
#mod2{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#mod2.on{display:flex}
#mod2 .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:340px;width:100%}
#mod2 p{margin:0 0 4px;font-weight:700;font-size:17px}#mod2 .acts{justify-content:flex-end;padding:8px 0 0}
#mod{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#mod.on{display:flex}
#mod .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:340px;width:100%}
#mod p{margin:0 0 16px;font-weight:600}#mod .acts{justify-content:flex-end;padding:0}
.btn.dg{background:var(--r);border-color:var(--r);color:#fff}
header{background:#000}
.logo{display:block;height:56px;max-width:100%;margin:0 0 6px}
</style>
</head>

<main id="app"></main>
<button id="fab" data-act="new" aria-label="Novo orçamento"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg></button>
<div id="toast"></div>
<div id="mod2"><div class="box"><p id="m2-t"></p><label>Nome do serviço<input id="m2-n"></label><label>Preço (R$)<input id="m2-p" inputmode="decimal"></label><div class="acts"><button class="btn" id="m2-c">Cancelar</button><button class="btn p" id="m2-s">Salvar</button></div></div></div>
<div id="mod"><div class="box"><p id="mod-t"></p><div class="acts"><button class="btn" id="mod-n">Cancelar</button><button class="btn dg" id="mod-y">Confirmar</button></div></div></div>
<input type="file" id="imp" accept=".json" hidden>
<script>
const $=s=>document.querySelector(s);
const R=v=>'R$ '+(+v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const KEY='orcamentos-ti-v1';
const SEED=[["Acesso remoto",80],["Atualização de drivers",100],["Backup de dados",80],["Contrato mensal (empresa)",300],["Diagnóstico completo",100],["Formatação completa",150],["Formatação simples",100],["Instalação de impressora",70],["Instalação de programas",50],["Instalação de SSD + sistema",220],["Limpeza de vírus",120],["Limpeza interna (desktop)",120],["Limpeza interna (notebook)",180],["Montagem de PC",250],["Otimização de sistema",100],["Recuperação de dados (simples)",180],["Troca de HD/SSD",80],["Upgrade de memória RAM",60],["Visita KM",2.5],["Visita técnica",80]];
let db=null;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.services)db={services:SEED.map((s,i)=>({id:'s'+i,name:s[0],price:s[1]})),quotes:[],seq:0,biz:'TechPrime Informática'};
if(!db.biz)db.biz='TechPrime Informática';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Não consegui salvar neste navegador')}};
let view='quotes',q=null,filter='';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)}
function svcForm(sv){
  $('#m2-t').textContent=sv?'Editar serviço':'Novo serviço';
  $('#m2-n').value=sv?sv.name:'';$('#m2-p').value=sv?String(sv.price).replace('.',','):'';
  const m=$('#mod2'),close=()=>m.classList.remove('on');m.classList.add('on');
  $('#m2-c').onclick=close;
  $('#m2-s').onclick=()=>{
    const n=$('#m2-n').value.trim();if(!n){toast('Digite o nome do serviço');return}
    const p=num($('#m2-p').value);
    if(sv){sv.name=n;sv.price=p}else db.services.push({id:'s'+Date.now(),name:n,price:p});
    db.services.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));save();close();render();toast('Serviço salvo');
  };
}
function ask(msg,cb,label,cls){
  $('#mod-t').textContent=msg;$('#mod-y').textContent=label||'Confirmar';$('#mod-y').className='btn '+(cls||'dg');$('#mod').classList.add('on');
  const close=()=>$('#mod').classList.remove('on');
  $('#mod-n').onclick=close;$('#mod-y').onclick=()=>{close();cb()};
}
const sub=x=>x.items.reduce((a,i)=>a+i.price*i.qty,0);
const tot=x=>Math.max(0,sub(x)-num(x.discount));
const fmtDate=d=>new Date(d).toLocaleDateString('pt-BR');

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('header nav').style.display=view==='form'?'none':'flex';
  $('#fab').style.display=view==='quotes'?'grid':'none';
  if(view==='quotes')quotesView();else if(view==='services')servicesView();else formView();
}
function quotesView(){
  const l=[...db.quotes].sort((a,b)=>b.num-a.num);
  $('#app').innerHTML=`<h2>Orçamentos</h2>`+(l.length?l.map(x=>`<div class=card><div class=row data-act=open data-id="${x.id}" style="border:0;cursor:pointer"><div class=n><b>#${x.num} ${esc(x.client||'Sem nome')}</b><small>${fmtDate(x.date)} · ${esc(x.equip||'')}</small></div><div><div class=pr>${R(tot(x))}</div><span class="tag ${x.status==='aprovado'?'ok':''}">${x.status==='aprovado'?'Aprovado':'Pendente'}</span></div></div>
  <div class=acts><button class="btn wa" data-act=sharesaved data-id="${x.id}">WhatsApp</button><button class=btn data-act=status data-id="${x.id}">${x.status==='aprovado'?'Marcar pendente':'Marcar aprovado'}</button><button class=btn data-act=del data-id="${x.id}">Excluir</button></div></div>`).join(''):`<div class=empty>Nenhum orçamento ainda.<br>Toque no botão verde para criar o primeiro.</div>`);
}
function servicesView(){
  $('#app').innerHTML=`<h2>Tabela de serviços</h2>
  <label>Seu nome ou empresa (aparece na mensagem)<input id=f-biz value="${esc(db.biz)}"></label>
  <label>Meu endereço base (usado se o GPS falhar)<input id=f-base value="${esc(db.base||'')}" placeholder="Rua, número, cidade"></label>
  <div class=top><button class="btn p" data-act=addsvc>+ Novo serviço</button><button class=btn data-act=exp>Backup</button><button class=btn data-act=imp>Restaurar</button></div>
  <div class=card>${db.services.map(s=>`<div class=row><div class=n>${esc(s.name)}</div><span class=pr>${R(s.price)}</span><button class=ib data-act=editsvc data-id="${s.id}" aria-label="Editar">✎</button><button class="ib d" data-act=delsvc data-id="${s.id}" aria-label="Excluir">🗑</button></div>`).join('')}</div>
  <small style="color:var(--mut)">Os dados ficam só neste celular. Faça backup de vez em quando.</small>`;
}
function newQuote(){q={id:null,num:0,date:Date.now(),client:'',phone:'',address:'',equip:'',items:[],roundTrip:true,kmInfo:'',discount:'',notes:'',status:'pendente'};filter='';view='form';render();window.scrollTo(0,0)}
function formView(){
  $('#app').innerHTML=`<div class=top style="margin-bottom:0"><button class=btn data-act=cancel>← Voltar</button></div><h2>${q.id?'Orçamento #'+q.num:'Novo orçamento'}</h2>
  <div class=card><label>Cliente<input id=f-client value="${esc(q.client)}" placeholder="Nome"></label>
  <label>WhatsApp do cliente<input id=f-phone inputmode=tel value="${esc(q.phone)}" placeholder="(15) 99999-9999"></label>
  <label>Endereço do cliente<input id=f-addr value="${esc(q.address)}" placeholder="Rua, número, bairro, cidade"></label>
  <label>Equipamento / problema<input id=f-equip value="${esc(q.equip)}" placeholder="Ex.: Notebook Dell lento"></label></div>
  <h3>Serviços</h3><input class=search id=f-search placeholder="Buscar serviço" value="${esc(filter)}"><div id=svc class=card></div><div id=km class=card style="display:none"></div>
  <h3>Peças e itens avulsos</h3><div id=ext class=card></div>
  <div class=card><label>Desconto (R$)<input id=f-disc inputmode=decimal value="${esc(q.discount)}"></label><label>Observações<textarea id=f-notes rows=3>${esc(q.notes)}</textarea></label></div>
  <div class=bar><div><small>Total</small><b id=tot></b></div><button class=btn data-act=save>Salvar</button><button class="btn wa" data-act=share>WhatsApp</button></div>`;
  drawSvc();drawKm();drawExt();drawTot();
}
function drawSvc(){
  const f=filter.toLowerCase();
  $('#svc').innerHTML=db.services.filter(s=>s.name.toLowerCase().includes(f)).map(s=>{const it=q.items.find(i=>i.sid===s.id),n=it?it.qty:0;
  return `<div class=row><div class=n>${esc(s.name)}<small>${R(s.price)}</small></div><div class="st ${n?'on':''}"><button data-act=minus data-id="${s.id}">−</button><b>${String(n).replace('.',',')}</b><button data-act=plus data-id="${s.id}">+</button></div></div>`}).join('')||'<div class=empty>Nada encontrado</div>';
}
function drawExt(){
  const ex=q.items.map((i,k)=>({i,k})).filter(o=>!o.i.sid);
  $('#ext').innerHTML=ex.map(o=>`<div class=row><div class=n>${esc(o.i.name)}<small>${o.i.qty} × ${R(o.i.price)}</small></div><button class="ib d" data-act=delext data-k="${o.k}">🗑</button></div>`).join('')+
  `<div class=row style="flex-wrap:wrap"><input id=x-n placeholder="Descrição (ex.: SSD 240GB)" style="flex:2 1 150px;margin:0"><input id=x-p inputmode=decimal placeholder="Valor" style="flex:1 1 70px;margin:0"><button class="btn p" data-act=addext>Adicionar</button></div>`;
}
function drawTot(){const e=$('#tot');if(e)e.textContent=R(tot(q))}
function buildMsg(x){
  const k=kmSvc(),L=[],f=n=>String(n).replace('.',',');
  L.push('*'+(db.biz||'Orçamento')+'*','');
  L.push('Olá'+(x.client?', *'+x.client+'*':'')+'! Conforme solicitado, segue o seu orçamento:','');
  L.push('*ORÇAMENTO Nº '+String(x.num).padStart(4,'0')+'*','Data: '+fmtDate(x.date)+'  |  Validade: 7 dias','');
  if(x.equip)L.push('*Equipamento:* '+x.equip);
  if(x.address)L.push('*Endereço:* '+x.address);
  L.push('','*Serviços e peças*');
  x.items.forEach((i,n)=>{
    let t=(n+1)+'. '+i.name;
    if(k&&i.sid===k.id)t+=' ('+f(i.qty)+' km × '+R(i.price)+')';
    else if(i.qty!==1)t+=' ('+f(i.qty)+' × '+R(i.price)+')';
    L.push(t+' — *'+R(i.price*i.qty)+'*');
  });
  L.push('');
  if(num(x.discount))L.push('Subtotal: '+R(sub(x)),'Desconto: -'+R(num(x.discount)));
  L.push('*TOTAL: '+R(tot(x))+'*');
  if(x.notes)L.push('','*Observações:* '+x.notes);
  L.push('','Este orçamento é válido por 7 dias.','Qualquer dúvida, estou à disposição!');
  return L.join('\n');
}
function openWA(x,t){
  let p=String(x.phone||'').replace(/\D/g,'');if(p&&p.length<=11)p='55'+p;
  window.open('https://wa.me/'+p+'?text='+encodeURIComponent(t||buildMsg(x)),'_blank');
}
const kmSvc=()=>db.services.find(s=>/\bkm\b/i.test(s.name));
function drawKm(){
  const k=kmSvc(),el=$('#km');if(!el)return;
  const on=k&&q.items.some(i=>i.sid===k.id);el.style.display=on?'block':'none';if(!on)return;
  el.innerHTML=`<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type=checkbox id=km-rt ${q.roundTrip?'checked':''} style="width:auto;margin:0"> Contar ida e volta</label><div class=acts><button class="btn p" data-act=calckm>Calcular KM até o cliente</button></div><div id=km-st style="color:var(--mut);font-size:14px;padding-bottom:10px">${esc(q.kmInfo||'Preencha o endereço do cliente e toque em calcular.')}</div>`;
}
const hav=(a,b)=>{const t=v=>v*Math.PI/180,A=t(b.lat-a.lat),B=t(b.lon-a.lon),h=Math.sin(A/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(B/2)**2;return 12742*Math.asin(Math.sqrt(h))};
async function geo(addr){
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&accept-language=pt-BR&q='+encodeURIComponent(addr));
  const j=await r.json();if(!j.length)throw new Error('nao-achou');
  return{lat:+j[0].lat,lon:+j[0].lon,nome:j[0].display_name};
}
const gps=()=>new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lon:p.coords.longitude}),no,{timeout:12000,maximumAge:60000}):no(new Error('sem gps')));
async function calcKm(){
  const st=$('#km-st'),k=kmSvc();
  if(!q.address.trim()){toast('Digite o endereço do cliente');return}
  st.textContent='Calculando...';
  try{
    let o,de='GPS';
    try{o=await gps()}catch(e){
      if(!db.base){st.textContent='Não consegui sua localização. Cadastre seu endereço base na aba Serviços.';return}
      o=await geo(db.base);de='endereço base';
    }
    const d=await geo(q.address);
    let km,est=false;
    try{const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+o.lon+','+o.lat+';'+d.lon+','+d.lat+'?overview=false');const j=await r.json();if(j.code!=='Ok')throw 0;km=j.routes[0].distance/1000}
    catch(e){km=hav(o,d)*1.3;est=true}
    const rt=q.roundTrip,v=Math.max(0.1,Math.round(km*(rt?2:1)*10)/10),f=n=>String(n).replace('.',',');
    const it=q.items.find(i=>i.sid===k.id);if(it)it.qty=v;
    q.kmInfo=f(km.toFixed(1))+' km'+(rt?' x2 (ida e volta) = '+f(v)+' km':'')+(est?' | estimativa em linha reta (rotas indisponíveis)':'')+' | Saída: '+de+' | Destino: '+d.nome;
    drawSvc();drawTot();drawKm();
  }catch(e){const m=$('#km-st');if(m)m.textContent=e&&e.message==='nao-achou'?'Endereço não encontrado. Tente com rua e cidade.':'Falha ao calcular. Verifique a internet.'}
}
function commit(){
  if(!q.items.length){toast('Escolha ao menos um serviço');return false}
  if(!q.id){q.id='q'+Date.now();q.num=++db.seq;db.quotes.push(q)}else{const k=db.quotes.findIndex(z=>z.id===q.id);db.quotes[k]=q}
  save();return true;
}
document.addEventListener('input',e=>{
  const m={'f-client':'client','f-phone':'phone','f-addr':'address','f-equip':'equip','f-disc':'discount','f-notes':'notes'},id=e.target.id;
  if(m[id]){q[m[id]]=e.target.value;drawTot()}
  else if(id==='f-search'){filter=e.target.value;drawSvc()}
  else if(id==='f-biz'){db.biz=e.target.value;save()}
  else if(id==='f-base'){db.base=e.target.value;save()}
  else if(id==='km-rt'){q.roundTrip=e.target.checked}
});
document.addEventListener('click',e=>{
  const nv=e.target.closest('nav button');if(nv){view=nv.dataset.v;render();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,find=()=>db.quotes.find(z=>z.id===id);
  if(a==='new')newQuote();
  else if(a==='open'){q=JSON.parse(JSON.stringify(find()));filter='';view='form';render();window.scrollTo(0,0)}
  else if(a==='cancel'){view='quotes';render()}
  else if(a==='save'){if(commit()){toast('Orçamento salvo');view='quotes';render()}}
  else if(a==='share'){if(commit())openWA(q)}
  else if(a==='calckm')calcKm();
  else if(a==='sharesaved')openWA(find());
  else if(a==='status'){const x=find();x.status=x.status==='aprovado'?'pendente':'aprovado';save();render()}
  else if(a==='del'){ask('Excluir este orçamento?',()=>{db.quotes=db.quotes.filter(z=>z.id!==id);save();render();toast('Orçamento excluído')})}
  else if(a==='plus'||a==='minus'){
    const s=db.services.find(z=>z.id===id);let it=q.items.find(i=>i.sid===id);
    if(a==='plus'){if(it)it.qty++;else q.items.push({sid:id,name:s.name,price:s.price,qty:1})}
    else if(it){it.qty--;if(it.qty<=0)q.items=q.items.filter(i=>i!==it)}
    drawSvc();drawTot();drawKm();
  }
  else if(a==='addext'){const n=$('#x-n').value.trim(),p=num($('#x-p').value);if(!n){toast('Digite a descrição');return}q.items.push({name:n,price:p,qty:1});drawExt();drawTot()}
  else if(a==='delext'){q.items.splice(+b.dataset.k,1);drawExt();drawTot()}
  else if(a==='addsvc')svcForm(null);
  else if(a==='editsvc')svcForm(db.services.find(z=>z.id===id));
  else if(a==='delsvc'){ask('Excluir este serviço?',()=>{db.services=db.services.filter(z=>z.id!==id);save();render();toast('Serviço excluído')})}
  else if(a==='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));l.download='backup-orcamentos-'+new Date().toISOString().slice(0,10)+'.json';l.click()}
  else if(a==='imp')$('#imp').click();
});
$('#imp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.services||!d.quotes)throw 0;ask('Substituir os dados atuais pelo backup?',()=>{db=d;save();render();toast('Backup restaurado')})}catch(x){toast('Arquivo inválido')}};
  r.readAsText(f);e.target.value='';
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
